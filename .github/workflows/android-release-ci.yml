name: Android release candidate
on:
  push:
    branches: [main, 'codex/android-*']
    paths: ['android/**', '.github/workflows/android-release-ci.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-release-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Verify APK and bundle
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/bundle/release/app-release.aab
          mkdir -p app/build/verified
          cp app/build/outputs/apk/debug/app-debug.apk app/build/verified/ClosetAI-Android-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/verified/ClosetAI-Android-unsigned.aab
          cd app/build/verified
          sha256sum *.apk *.aab > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: ClosetAI-Android-RC
          path: android/app/build/verified/
          if-no-files-found: error
          retention-days: 30

  device-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClosetAI-Android-RC
          path: packages
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: bash android/scripts/device-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-smoke
          path: device-evidence/
